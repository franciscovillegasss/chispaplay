services:
  - type: web
    name: chispaplay
    runtime: python
    plan: starter
    buildCommand: python -m compileall -q server.py auth.py core.py events.py management.py sms.py
    startCommand: python server.py
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    disk:
      name: chispaplay-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: CHISPA_DATA_DIR
        value: /var/data
      - key: CHISPA_PUBLIC_ORIGIN
        sync: false
      - key: TWILIO_API_KEY
        sync: false
      - key: TWILIO_API_SECRET
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
